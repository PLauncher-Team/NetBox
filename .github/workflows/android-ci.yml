name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run lint, unit tests, and build ABI APKs
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:collectDebugApks

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: netbox-debug-apks
          path: build/apks/debug/*.apk
          if-no-files-found: error
          retention-days: 14
